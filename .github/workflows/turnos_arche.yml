# Arché aprende en la nube aunque tu PC esté apagado.
# Cada 6 horas GitHub enciende una máquina gratis, corre nube/turno.py
# (pide ejemplos nuevos a Groq, los filtra y los guarda en Supabase) y se apaga.
# Tu PC los descarga y los aprende la próxima vez que abras Arché.
#
# Necesita 3 secretos (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, GROQ_API_KEY
name: Turnos de Arché en la nube

on:
  schedule:
    - cron: "17 */6 * * *"     # 4 turnos al día (hora UTC)
  workflow_dispatch:           # botón "Run workflow" para correr uno ya

permissions:
  contents: read

concurrency:
  group: turnos-arche
  cancel-in-progress: false

jobs:
  turno:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Turno de aprendizaje
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -I nube/turno.py
