# Corre las pruebas de Arché en cada subida y en cada pull request.
# Si una prueba falla, GitHub marca la subida con una X roja.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Sintaxis de todo el código
        run: python -m compileall -q Arche nube
      - name: Pruebas de Arché
        working-directory: Arche
        run: python correr_pruebas.py
      - name: Examen fijo (solo si hay modelo entrenado)
        working-directory: Arche
        run: python evaluar_examen_fijo.py --sin-guardar
